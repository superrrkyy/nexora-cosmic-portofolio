name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Derive Pages base from actual repository
        env:
          BASE_OVERRIDE: ${{ vars.PAGES_BASE_PATH }}
          SITE_OVERRIDE: ${{ vars.PAGES_SITE_URL }}
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ -n "$BASE_OVERRIDE" ]]; then
            BASE="$BASE_OVERRIDE"
          elif [[ "${REPO,,}" == "${OWNER,,}.github.io" ]]; then
            BASE="/"
          else
            BASE="/$REPO/"
          fi
          echo "VITE_BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=${SITE_OVERRIDE:-https://${OWNER}.github.io${BASE}}" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run verify:assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
